<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FOC Encrypted Content Viewer</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f7f3ed;
        --surface: #fffdfa;
        --ink: #0d1b3d;
        --muted: #59657b;
        --coral: #f05d43;
        --coral-soft: #ffe5de;
        --rule: #d9d1c5;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 88% 18%, rgba(240, 93, 67, 0.2), transparent 25rem),
          radial-gradient(circle at 8% 92%, rgba(142, 182, 216, 0.28), transparent 28rem),
          var(--paper);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      #app {
        width: min(920px, calc(100% - 32px));
        padding: 32px 0;
      }

      #app.wide {
        width: min(1200px, calc(100% - 32px));
      }

      .evidence-gate {
        display: grid;
        grid-template-columns: minmax(0, 0.88fr) minmax(0, 1.12fr);
        overflow: hidden;
        border: 1px solid var(--rule);
        border-radius: 24px;
        background: var(--surface);
        box-shadow: 0 24px 70px rgba(13, 27, 61, 0.14);
      }

      .evidence {
        padding: clamp(28px, 5vw, 52px);
        background: var(--ink);
        color: white;
      }

      .eyebrow {
        margin: 0 0 34px;
        color: #f7aa99;
        font-size: 0.73rem;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 13ch;
        margin: 0 0 18px;
        font-size: clamp(2.2rem, 5vw, 4.2rem);
        line-height: 0.96;
        letter-spacing: -0.055em;
      }

      .evidence > p:not(.eyebrow) {
        margin: 0;
        color: #c9d2e4;
      }

      .evidence ul {
        display: grid;
        gap: 13px;
        margin: 38px 0 0;
        padding: 0;
        list-style: none;
      }

      .evidence li {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        color: #e6ebf4;
        font-size: 0.9rem;
      }

      .evidence li::before {
        content: "";
        width: 8px;
        height: 8px;
        margin-top: 0.45rem;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #78c9a9;
      }

      .password-form,
      .missing-link {
        padding: clamp(28px, 5vw, 52px);
        align-self: center;
      }

      .password-form label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .password-input {
        position: relative;
      }

      .password-input input {
        width: 100%;
        height: 52px;
        padding: 0 58px 0 14px;
        border: 1px solid #bcb4aa;
        border-radius: 11px;
        background: white;
        color: var(--ink);
        font: inherit;
      }

      .password-input input:focus-visible,
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid rgba(240, 93, 67, 0.35);
        outline-offset: 2px;
      }

      .password-toggle {
        position: absolute;
        top: 4px;
        right: 4px;
        display: grid;
        width: 44px;
        min-height: 44px;
        margin: 0;
        padding: 0;
        place-items: center;
        border-radius: 8px;
        background: transparent;
        color: var(--ink);
        font-size: 1.2rem;
        line-height: 1;
      }

      .password-toggle:hover {
        background: var(--coral-soft);
      }

      button {
        width: 100%;
        min-height: 48px;
        margin-top: 12px;
        border: 0;
        border-radius: 11px;
        background: var(--coral);
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 780;
      }

      button:hover {
        background: #d94c35;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.68;
      }

      .hint {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 0.78rem;
      }

      .error {
        margin: 14px 0 0;
        padding: 10px 12px;
        border-radius: 9px;
        background: var(--coral-soft);
        color: #9d2e1f;
        font-size: 0.84rem;
        font-weight: 650;
      }

      .missing-link {
        max-width: 560px;
        margin: 0 auto;
        border: 1px solid var(--rule);
        border-radius: 20px;
        background: var(--surface);
        box-shadow: 0 18px 50px rgba(13, 27, 61, 0.1);
      }

      .missing-link .eyebrow {
        margin-bottom: 22px;
        color: var(--coral);
      }

      .missing-link h1 {
        max-width: none;
        color: var(--ink);
      }

      .missing-link p:last-child {
        margin: 0;
        color: var(--muted);
      }

      .content-wrapper {
        width: 100%;
      }

      .content-wrapper img {
        max-width: 100%;
        display: block;
        margin: 0 auto;
      }

      .content-wrapper pre {
        white-space: pre-wrap;
        word-break: break-word;
        padding: 1rem;
        border: 1px solid var(--rule);
        border-radius: 10px;
        background: var(--surface);
        color: var(--ink);
        font-size: 0.9rem;
      }

      .content-wrapper embed,
      .content-wrapper iframe {
        width: 100%;
        min-height: 80vh;
        border: 0;
      }

      .download-link {
        display: inline-block;
        margin-top: 1rem;
        color: var(--ink);
        text-decoration-color: var(--coral);
        text-decoration-thickness: 2px;
      }

      @media (max-width: 700px) {
        .evidence-gate {
          grid-template-columns: 1fr;
        }

        .evidence,
        .password-form {
          padding: 28px;
        }

        .evidence ul {
          margin-top: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
