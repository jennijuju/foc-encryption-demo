<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>engram · protected share</title>
    <style>
      @font-face {
        font-family: Satoshi;
        src: url("./assets/Satoshi-Variable.ttf") format("truetype");
        font-weight: 300 900;
        font-display: swap;
      }

      :root {
        color-scheme: light;
        --paper: #f7f3ed;
        --surface: #fffdfa;
        --ink: #0d1b3d;
        --muted: #59657b;
        --accent: #7185f5;
        --accent-soft: #e7e9fb;
        --lavender: #c2c6f1;
        --gold: #e2b77a;
        --rule: #d9d1c5;
        --error: #a53a2a;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 84% 14%, rgba(169, 177, 244, 0.76), transparent 32rem),
          radial-gradient(circle at 8% 92%, rgba(113, 133, 245, 0.24), transparent 30rem),
          linear-gradient(135deg, #eef0ff 0%, #f7f3ed 52%, #e7e9fb 100%);
        color: var(--ink);
        font-family: Satoshi, Inter, ui-sans-serif, system-ui, sans-serif;
        line-height: 1.5;
      }


      #app {
        width: min(960px, calc(100% - 48px));
        padding: 32px 0;
      }

      #app.wide {
        width: min(1200px, calc(100% - 32px));
      }

      .evidence-gate {
        display: grid;
        grid-template-columns: minmax(0, 1.03fr) minmax(380px, 0.97fr);
        overflow: hidden;
        border: 1px solid var(--rule);
        border-radius: 20px;
        background: var(--paper);
        box-shadow: 0 28px 80px rgba(13, 27, 61, 0.16);
      }

      .evidence {
        position: relative;
        overflow: hidden;
        display: flex;
        min-height: 560px;
        padding: clamp(36px, 5vw, 58px);
        flex-direction: column;
        background:
          radial-gradient(circle at 82% 88%, rgba(113, 133, 245, 0.16), transparent 18rem),
          var(--ink);
        border-radius: 20px 0 0 20px;
        color: white;
      }
      

      .engram-corner-wash {
        position: absolute;
        top: -118px;
        right: -96px;
        width: 430px;
        height: auto;
        opacity: 0.26;
        transform: rotate(160deg);
        pointer-events: none;
      }

      .engram-corner-mark {
        position: absolute;
        top: -34px;
        right: -72px;
        width: 480px;
        height: auto;
        opacity: 0.88;
        transform: none;
        pointer-events: none;
        z-index: 1;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--gold);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 11ch;
        margin: 0 0 20px;
        font-size: clamp(2.5rem, 5vw, 4.6rem);
        font-weight: 620;
        line-height: 0.96;
        letter-spacing: -0.055em;
      }

      .evidence > p:not(.eyebrow) {
        max-width: 39ch;
        margin: 0;
        color: #cbd3e7;
        font-size: 0.98rem;
      }


      .evidence ul {
        display: grid;
        gap: 13px;
        margin: 32px 0 0;
        padding: 0;
        list-style: none;
      }

      .evidence li {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        color: #e7ebf5;
        font-size: 0.86rem;
      }

      .evidence li::before {
        content: "";
        width: 8px;
        height: 8px;
        margin-top: 0.45rem;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--gold);
      }

      .password-form,
      .missing-link {
        padding: clamp(36px, 5vw, 58px);
        align-self: center;
      }

      .password-form {
        position: relative;
        overflow: hidden;
        display: flex;
        min-height: 560px;
        align-self: stretch;
        flex-direction: column;
        justify-content: flex-start;
        background: rgba(247, 243, 237, 0.92);
        border-radius: 0 20px 20px 0;
        padding-top: 190px;
      }

      .form-heading {
        margin-bottom: 34px;
      }

      .form-kicker {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .password-form h2 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 4vw, 2.8rem);
        font-weight: 650;
        line-height: 1;
        letter-spacing: -0.045em;
      }

      .form-heading > p:last-child {
        margin: 0;
        color: var(--muted);
      }

      .password-form label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .password-input {
        position: relative;
      }

      .password-input input {
        width: 100%;
        height: 52px;
        padding: 0 58px 0 14px;
        border: 1px solid #aaaec5;
        border-radius: 10px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
      }

      .password-input input:focus-visible,
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid rgba(113, 133, 245, 0.32);
        outline-offset: 2px;
      }

      .password-toggle {
        position: absolute;
        top: 4px;
        right: 4px;
        display: grid;
        width: 44px;
        min-height: 44px;
        margin: 0;
        padding: 0;
        place-items: center;
        border-radius: 8px;
        background: transparent;
        color: var(--ink);
        line-height: 1;
      }

      .password-toggle svg {
        width: 20px;
        height: 20px;
      }

      .password-toggle:hover {
        background: var(--accent-soft);
      }

      button {
        width: 100%;
        min-height: 48px;
        margin-top: 12px;
        border: 0;
        border-radius: 10px;
        background: var(--ink);
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 780;
      }

      button:hover {
        background: #172a56;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.68;
      }

      .hint {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 0.78rem;
      }

      .error {
        margin: 14px 0 0;
        padding: 10px 12px;
        border-radius: 9px;
        background: #f7dfda;
        color: var(--error);
        font-size: 0.84rem;
        font-weight: 650;
      }

      .missing-link {
        max-width: 560px;
        margin: 0 auto;
        border: 1px solid var(--rule);
        border-radius: 20px;
        background: var(--surface);
        box-shadow: 0 18px 50px rgba(13, 27, 61, 0.1);
      }

      .missing-link .eyebrow {
        margin-bottom: 22px;
        color: var(--accent);
      }

      .missing-link h1 {
        max-width: none;
        color: var(--ink);
      }

      .missing-link p:last-child {
        margin: 0;
        color: var(--muted);
      }

      .content-wrapper {
        width: 100%;
      }

      .content-wrapper img {
        max-width: 100%;
        display: block;
        margin: 0 auto;
      }

      .content-wrapper pre {
        white-space: pre-wrap;
        word-break: break-word;
        padding: 1rem;
        border: 1px solid var(--rule);
        border-radius: 10px;
        background: var(--surface);
        color: var(--ink);
        font-size: 0.9rem;
      }

      .content-wrapper embed,
      .content-wrapper iframe {
        width: 100%;
        min-height: 80vh;
        border: 0;
      }

      .download-link {
        display: inline-block;
        margin-top: 1rem;
        color: var(--ink);
        text-decoration-color: var(--accent);
        text-decoration-thickness: 2px;
      }

      @media (max-width: 700px) {
        .evidence-gate {
          grid-template-columns: 1fr;
        }

        .evidence,
        .password-form {
          min-height: auto;
          padding: 34px 28px;
        }

        .password-form {
          padding-top: 150px;
        }

        .evidence {
          border-radius: 20px 20px 0 0;
        }

        .password-form {
          border-radius: 0 0 20px 20px;
        }


        .engram-corner-mark {
          top: -20px;
          right: -80px;
          width: 360px;
          transform: none;
        }

        .engram-corner-wash {
          top: -80px;
          right: -90px;
          width: 330px;
        }

        .evidence ul {
          margin-top: 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
